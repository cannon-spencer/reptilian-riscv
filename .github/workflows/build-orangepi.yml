name: Build Orange Pi RV OS

on:
  push:
    branches: [main]
    paths-ignore:
      - "build/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu bison flex libssl-dev \
            device-tree-compiler python3 xz-utils qemu-user-static

      - name: Build
        run: ./scripts/ci-build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete orangepi-rv --yes || true
          git push origin :refs/tags/orangepi-rv || true
          gh release create orangepi-rv \
            build/visionfive2_fw_payload.img \
            build/os.img.xz \
            --title "Orange Pi RV" \
            --notes "CI build from scripts/ci-build.sh"

      - name: Commit firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/visionfive2_fw_payload.img
          git diff --staged --quiet && exit 0
          git commit -m "ci: Orange Pi RV firmware [skip ci]"
          git push
